
services:
  postgres:
    image: postgres:16
    container_name: sharekar-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: sharekar_user
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: sharekar_db

    ports:
      - "5433:5432"

    volumes:
      - sharekar_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharekar_user -d sharekar_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sharekar_postgres_data:
